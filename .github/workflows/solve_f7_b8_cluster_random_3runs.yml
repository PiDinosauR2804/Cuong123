name: Solve F7 B10 Cluster+Random (3 Runs)

on:
  push:
  workflow_dispatch:
    inputs:
      cluster_dir:
        description: "Cluster dataset dir (B10)"
        required: false
        default: "test_data/data_demand_random_50_batch_custom_cluster_all_flat"
      random_dir:
        description: "Random dataset dir (B10)"
        required: false
        default: "test_data/data_demand_random_50_batch_custom_random_all_flat"
      solver_time_limit_sec:
        description: "Per-run solver time limit (seconds)"
        required: false
        default: "7200"
      max_parallel:
        description: "Max parallel jobs"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      count: ${{ steps.mk.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: mk
        env:
          CLUSTER_DIR: ${{ github.event.inputs.cluster_dir || 'test_data/data_demand_random_50_batch_custom_cluster_all_flat' }}
          RANDOM_DIR: ${{ github.event.inputs.random_dir || 'test_data/data_demand_random_50_batch_custom_random_all_flat' }}
        run: |
          python - << 'PY'
          import json, os, pathlib, re

          def collect(dat_dir: pathlib.Path, group: str):
              out = []
              for p in sorted(dat_dir.glob("R101_*_B10_v*.dat")):
                  m = re.match(r"^R101_([0-9]+(?:\.[0-9]+)?)_B([0-9]+)_v([0-9]+)\.dat$", p.name)
                  beta = m.group(1) if m else ""
                  b = m.group(2) if m else ""
                  v = m.group(3) if m else ""
                  for run_idx in (1, 2, 3):
                      run_name = f"{group}_{p.stem}_r{run_idx}"
                      out.append({
                          "dat": str(p),
                          "group": group,
                          "instance_name": p.name,
                          "beta": beta,
                          "B": b,
                          "version": v,
                          "run_index": run_idx,
                          "run_name": run_name
                      })
              return out

          tasks = []
          tasks += collect(pathlib.Path(os.environ["CLUSTER_DIR"]), "cluster")
          tasks += collect(pathlib.Path(os.environ["RANDOM_DIR"]), "random")

          with open("matrix.json", "w", encoding="utf-8") as f:
              json.dump(tasks, f)

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as g:
              g.write("matrix=" + json.dumps(tasks) + "\n")
              g.write("count=" + str(len(tasks)) + "\n")
          print(f"[MATRIX] tasks={len(tasks)}")
          PY

  solve:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(github.event.inputs.max_parallel || '20') }}
      matrix:
        task: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build read_data_f7
        run: g++ -std=c++17 -O2 C_Version/Function7.cpp -o C_Version/read_data_f7

      - name: Run one task (single process per job) and collect outputs
        env:
          TASK_JSON: ${{ toJson(matrix.task) }}
          SOLVER_TIME_LIMIT_SEC: ${{ github.event.inputs.solver_time_limit_sec || '7200' }}
        run: |
          mkdir -p run_logs run_outputs
          python - << 'PY'
          import ast, json, os, pathlib, re, shutil, subprocess, sys, math

          task = json.loads(os.environ["TASK_JSON"])
          run_name = task["run_name"]
          dat_path = task["dat"]
          out_dir = pathlib.Path("run_outputs") / run_name
          out_dir.mkdir(parents=True, exist_ok=True)
          log_path = pathlib.Path("run_logs") / f"{run_name}.log"

          try:
              solver_limit_sec = float(os.environ.get("SOLVER_TIME_LIMIT_SEC", "7200"))
          except Exception:
              solver_limit_sec = 7200.0
          solver_limit_sec = max(1.0, min(7200.0, solver_limit_sec))
          solver_limit_str = str(int(solver_limit_sec)) if abs(solver_limit_sec - int(solver_limit_sec)) < 1e-9 else str(solver_limit_sec)

          env = os.environ.copy()
          env["FIX_DEMAND_EQUAL1"] = "1"
          env["N_TRUCK"] = "2"
          env["N_DRONE"] = "2"
          env["SOL_OUT_DIR"] = str(out_dir)
          env["SOLVER_TIME_LIMIT_SEC"] = solver_limit_str

          cmd = ["C_Version/read_data_f7", dat_path, "8", "90"]
          with log_path.open("w", encoding="utf-8") as lf:
              proc = subprocess.run(cmd, stdout=lf, stderr=subprocess.STDOUT, env=env, check=False)
          txt = log_path.read_text(encoding="utf-8", errors="replace")

          def first_text(pattern: str) -> str:
              m = re.search(pattern, txt)
              return m.group(1).strip() if m else ""

          def first_float(pattern: str):
              m = re.search(pattern, txt)
              if not m:
                  return None
              try:
                  return float(m.group(1))
              except Exception:
                  return None

          def clean_path(p: str) -> str:
              p = (p or "").strip()
              return "" if p in {"(write failed)", "(not found)"} else p

          def resolve_path(p: str):
              if not p:
                  return None
              q = pathlib.Path(p)
              if not q.is_absolute():
                  q = pathlib.Path(".") / q
              return q if q.exists() else None

          def read_solution_text(p: str) -> str:
              q = resolve_path(p)
              if q is None:
                  return ""
              return q.read_text(encoding="utf-8", errors="replace").strip()

          def validate_solution_file(path_str: str) -> bool:
              q = resolve_path(path_str)
              if q is None:
                  return False
              envv = os.environ.copy()
              envv["VALIDATE_ONLY"] = "1"
              envv["N_TRUCK"] = "2"
              envv["N_DRONE"] = "2"
              envv["FIX_DEMAND_EQUAL1"] = "1"
              r = subprocess.run(
                  ["C_Version/read_data_f7", dat_path, "8", "90", str(q)],
                  capture_output=True,
                  text=True,
                  env=envv,
                  check=False,
              )
              return (r.returncode == 0) and ("[VALIDATE] OK" in ((r.stdout or "") + (r.stderr or "")))

          def parse_solution(sol_text: str):
              if not sol_text:
                  return None
              s = sol_text.strip()
              if s.lower().startswith("solution"):
                  k = s.find("=")
                  if k >= 0:
                      s = s[k + 1 :].strip()
              try:
                  return ast.literal_eval(s)
              except Exception:
                  return None

          def parse_dat_meta(path: str):
              sigma = 1.0
              coords = {}
              lines = pathlib.Path(path).read_text(encoding="utf-8", errors="replace").splitlines()
              data_start = 8
              for i, ln in enumerate(lines[:8]):
                  tok = ln.split()
                  if tok and tok[0].lower() == "sigma":
                      try:
                          sigma = float(tok[-1])
                      except Exception:
                          pass
              idx = 0
              for ln in lines[data_start:]:
                  if not ln.strip():
                      continue
                  t = ln.split()
                  if len(t) >= 2:
                      try:
                          cid = idx
                          x, y = float(t[0]), float(t[1])
                          coords[cid] = (x, y)
                          idx += 1
                      except Exception:
                          pass
              return sigma, coords

          def dist(coords, a, b):
              ax, ay = coords.get(a, (0.0, 0.0))
              bx, by = coords.get(b, (0.0, 0.0))
              return math.hypot(ax - bx, ay - by)

          def metrics_from_solution(sol_obj, sigma, coords):
              if not isinstance(sol_obj, list) or len(sol_obj) < 2:
                  return {"trip_count": 0, "multi_visit_trip_count": 0, "avg_customers_per_trip": None, "avg_drone_trip_time": None}
              dq = sol_obj[1] if isinstance(sol_obj[1], list) else []
              trip_count = len(dq)
              if trip_count == 0:
                  return {"trip_count": 0, "multi_visit_trip_count": 0, "avg_customers_per_trip": 0.0, "avg_drone_trip_time": 0.0}
              multi_count = 0
              total_pkg = 0
              total_trip_time = 0.0
              for tr in dq:
                  evs = tr if isinstance(tr, list) else []
                  if len(evs) >= 2:
                      multi_count += 1
                  total_pkg += sum(len(ev[1]) for ev in evs if isinstance(ev, list) and len(ev) >= 2 and isinstance(ev[1], list))
                  nodes = [0] + [int(ev[0]) for ev in evs if isinstance(ev, list) and len(ev) >= 1] + [0]
                  t = 0.0
                  for i in range(len(nodes) - 1):
                      t += dist(coords, nodes[i], nodes[i + 1]) / max(1e-9, sigma)
                  total_trip_time += t
              return {
                  "trip_count": trip_count,
                  "multi_visit_trip_count": multi_count,
                  "avg_customers_per_trip": total_pkg / trip_count if trip_count else 0.0,
                  "avg_drone_trip_time": total_trip_time / trip_count if trip_count else 0.0,
              }

          best_path = clean_path(first_text(r"\[SOL\] best solution file:\s*(.+)"))
          best_multi_path = clean_path(first_text(r"\[SOL\] best multi-visit solution file:\s*(.+)"))
          best_single_path = clean_path(first_text(r"\[SOL\] best single-visit solution file:\s*(.+)"))
          best_no_resupply_path = clean_path(first_text(r"\[SOL\] best no-resupply solution file:\s*(.+)"))

          best_fitness = first_float(r"Makespan:\s*([0-9]+(?:\.[0-9]+)?)")
          best_multi_fitness = first_float(r"\[SOL\] best multi-visit makespan:\s*([0-9]+(?:\.[0-9]+)?)")
          best_single_fitness = first_float(r"\[SOL\] best single-visit makespan:\s*([0-9]+(?:\.[0-9]+)?)")
          best_no_resupply_fitness = first_float(r"\[SOL\] best no-resupply makespan:\s*([0-9]+(?:\.[0-9]+)?)")

          best_text = read_solution_text(best_path)
          best_multi_text = read_solution_text(best_multi_path)
          best_single_text = read_solution_text(best_single_path)
          best_no_resupply_text = read_solution_text(best_no_resupply_path)

          best_valid = validate_solution_file(best_path) if best_path else False
          best_multi_valid = validate_solution_file(best_multi_path) if best_multi_path else False
          best_single_valid = validate_solution_file(best_single_path) if best_single_path else False
          best_no_resupply_valid = validate_solution_file(best_no_resupply_path) if best_no_resupply_path else False

          if not best_valid:
              best_path = ""
              best_text = ""
              best_fitness = None
          if not best_multi_valid:
              best_multi_path = ""
              best_multi_text = ""
              best_multi_fitness = None
          if not best_single_valid:
              best_single_path = ""
              best_single_text = ""
              best_single_fitness = None
          if not best_no_resupply_valid:
              best_no_resupply_path = ""
              best_no_resupply_text = ""
              best_no_resupply_fitness = None

          sigma, coords = parse_dat_meta(dat_path)
          best_m = metrics_from_solution(parse_solution(best_text), sigma, coords)
          best_multi_m = metrics_from_solution(parse_solution(best_multi_text), sigma, coords)
          best_single_m = metrics_from_solution(parse_solution(best_single_text), sigma, coords)
          best_no_resupply_m = metrics_from_solution(parse_solution(best_no_resupply_text), sigma, coords)

          (out_dir / "best_solution.txt").write_text(best_text, encoding="utf-8")
          (out_dir / "best_multi_visit_solution.txt").write_text(best_multi_text, encoding="utf-8")
          (out_dir / "best_single_visit_solution.txt").write_text(best_single_text, encoding="utf-8")
          (out_dir / "best_no_resupply_solution.txt").write_text(best_no_resupply_text, encoding="utf-8")

          rp = resolve_path(best_path)
          if rp is not None: shutil.copy2(rp, out_dir / "raw_best_solution.txt")
          rp = resolve_path(best_multi_path)
          if rp is not None: shutil.copy2(rp, out_dir / "raw_best_multi_visit_solution.txt")
          rp = resolve_path(best_single_path)
          if rp is not None: shutil.copy2(rp, out_dir / "raw_best_single_visit_solution.txt")
          rp = resolve_path(best_no_resupply_path)
          if rp is not None: shutil.copy2(rp, out_dir / "raw_best_no_resupply_solution.txt")

          meta = {
              "run_name": run_name,
              "instance": dat_path,
              "instance_name": task["instance_name"],
              "group": task["group"],
              "beta": task["beta"],
              "B": task["B"],
              "version": task["version"],
              "run_index": task["run_index"],
              "A": 8,
              "L": 90,
              "n_truck": 2,
              "n_drone": 2,
              "solver_time_limit_sec": solver_limit_str,
              "return_code": proc.returncode,
              "best_fitness": best_fitness,
              "best_multi_fitness": best_multi_fitness,
              "best_mult_fitness": best_multi_fitness,
              "best_single_fitness": best_single_fitness,
              "best_no_resupply_fitness": best_no_resupply_fitness,
              "best_solution": best_path,
              "best_multi_solution": best_multi_path,
              "best_single_solution": best_single_path,
              "best_no_resupply_solution": best_no_resupply_path,
              "best_solution_file": best_path,
              "best_multi_solution_file": best_multi_path,
              "best_single_solution_file": best_single_path,
              "best_no_resupply_solution_file": best_no_resupply_path,
              "best_solution_valid": best_valid,
              "best_multi_solution_valid": best_multi_valid,
              "best_single_solution_valid": best_single_valid,
              "best_no_resupply_solution_valid": best_no_resupply_valid,
              "best_trip_count": best_m.get("trip_count"),
              "best_multi_visit_trip_count": best_m.get("multi_visit_trip_count"),
              "best_avg_customers_per_trip": best_m.get("avg_customers_per_trip"),
              "best_avg_drone_trip_time": best_m.get("avg_drone_trip_time"),
              "best_multi_trip_count": best_multi_m.get("trip_count"),
              "best_multi_multi_visit_trip_count": best_multi_m.get("multi_visit_trip_count"),
              "best_multi_avg_customers_per_trip": best_multi_m.get("avg_customers_per_trip"),
              "best_multi_avg_drone_trip_time": best_multi_m.get("avg_drone_trip_time"),
              "best_single_trip_count": best_single_m.get("trip_count"),
              "best_single_multi_visit_trip_count": best_single_m.get("multi_visit_trip_count"),
              "best_single_avg_customers_per_trip": best_single_m.get("avg_customers_per_trip"),
              "best_single_avg_drone_trip_time": best_single_m.get("avg_drone_trip_time"),
              "best_no_resupply_trip_count": best_no_resupply_m.get("trip_count"),
              "best_no_resupply_multi_visit_trip_count": best_no_resupply_m.get("multi_visit_trip_count"),
              "best_no_resupply_avg_customers_per_trip": best_no_resupply_m.get("avg_customers_per_trip"),
              "best_no_resupply_avg_drone_trip_time": best_no_resupply_m.get("avg_drone_trip_time"),
              "log_file": str(log_path),
          }
          (out_dir / "meta.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"[DONE] {run_name} rc={proc.returncode}")
          if proc.returncode != 0:
              sys.exit(proc.returncode)
          PY

      - name: Upload per-run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run_${{ matrix.task.run_name }}
          path: |
            run_outputs/${{ matrix.task.run_name }}
            run_logs/${{ matrix.task.run_name }}.log
          if-no-files-found: warn

  aggregate:
    needs: [build-matrix, solve]
    if: always() && needs.build-matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: run_*
          path: downloaded
          merge-multiple: false
          if-no-artifact-found: warn

      - name: Build summary CSVs
        if: always()
        run: |
          python - << 'PY'
          import csv, json, pathlib, re
          metas = sorted(pathlib.Path("downloaded").rglob("meta.json"))
          rows = []
          row_meta_path = {}
          for p in metas:
              try:
                  r = json.loads(p.read_text(encoding="utf-8"))
                  rows.append(r)
                  if r.get("run_name"):
                      row_meta_path[r.get("run_name")] = p
              except Exception:
                  pass
          rows.sort(key=lambda r: (r.get("group",""), r.get("instance_name",""), int(r.get("run_index",0))))

          out_dir = pathlib.Path("results")
          out_dir.mkdir(parents=True, exist_ok=True)
          sol_dir = out_dir / "solutions"
          (sol_dir / "best").mkdir(parents=True, exist_ok=True)
          (sol_dir / "best_multi").mkdir(parents=True, exist_ok=True)
          (sol_dir / "best_single").mkdir(parents=True, exist_ok=True)
          (sol_dir / "best_no_resupply").mkdir(parents=True, exist_ok=True)

          def safe_name(s: str) -> str:
              return re.sub(r"[^A-Za-z0-9_.-]+", "_", s or "").strip("_") or "unknown"

          def save_solution_copy(src: pathlib.Path, dst: pathlib.Path):
              if not src.exists():
                  return ""
              txt = src.read_text(encoding="utf-8", errors="replace")
              if not txt.strip():
                  return ""
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text(txt, encoding="utf-8")
              return str(dst)

          for r in rows:
              run_name = r.get("run_name", "")
              meta_path = row_meta_path.get(run_name)
              if not meta_path:
                  continue
              run_dir = meta_path.parent
              inst = safe_name(r.get("instance_name", "instance"))
              rn = safe_name(run_name)
              r["summary_best_solution_text_file"] = save_solution_copy(
                  run_dir / "best_solution.txt",
                  sol_dir / "best" / f"{rn}__{inst}.txt",
              )
              r["summary_best_multi_solution_text_file"] = save_solution_copy(
                  run_dir / "best_multi_visit_solution.txt",
                  sol_dir / "best_multi" / f"{rn}__{inst}.txt",
              )
              r["summary_best_single_solution_text_file"] = save_solution_copy(
                  run_dir / "best_single_visit_solution.txt",
                  sol_dir / "best_single" / f"{rn}__{inst}.txt",
              )
              r["summary_best_no_resupply_solution_text_file"] = save_solution_copy(
                  run_dir / "best_no_resupply_solution.txt",
                  sol_dir / "best_no_resupply" / f"{rn}__{inst}.txt",
              )

          out_csv = out_dir / "summary_f7_b10_cluster_random_3runs.csv"
          fields = [
              "run_name","instance","instance_name","group","beta","B","version","run_index",
              "A","L","n_truck","n_drone","solver_time_limit_sec","return_code",
              "best_fitness","best_multi_fitness","best_mult_fitness","best_single_fitness","best_no_resupply_fitness",
              "best_solution","best_multi_solution","best_single_solution","best_no_resupply_solution",
              "best_solution_file","best_multi_solution_file","best_single_solution_file","best_no_resupply_solution_file",
              "best_solution_valid","best_multi_solution_valid","best_single_solution_valid","best_no_resupply_solution_valid",
              "best_trip_count","best_multi_visit_trip_count","best_avg_customers_per_trip","best_avg_drone_trip_time",
              "best_multi_trip_count","best_multi_multi_visit_trip_count","best_multi_avg_customers_per_trip","best_multi_avg_drone_trip_time",
              "best_single_trip_count","best_single_multi_visit_trip_count","best_single_avg_customers_per_trip","best_single_avg_drone_trip_time",
              "best_no_resupply_trip_count","best_no_resupply_multi_visit_trip_count","best_no_resupply_avg_customers_per_trip","best_no_resupply_avg_drone_trip_time",
              "summary_best_solution_text_file","summary_best_multi_solution_text_file","summary_best_single_solution_text_file","summary_best_no_resupply_solution_text_file",
              "log_file"
          ]
          with out_csv.open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
              w.writeheader()
              w.writerows(rows)

          # Per-instance average across 3 runs
          from collections import defaultdict
          grp = defaultdict(list)
          for r in rows:
              key = (r.get("group",""), r.get("instance_name",""), r.get("beta",""), r.get("B",""), r.get("version",""))
              grp[key].append(r)

          def avg_num(vs):
              xs = [x for x in vs if isinstance(x, (int,float))]
              return (sum(xs) / len(xs)) if xs else None

          avg_rows = []
          for k, items in sorted(grp.items()):
              def vals(field):
                  out = []
                  for it in items:
                      v = it.get(field, None)
                      try:
                          out.append(float(v))
                      except Exception:
                          pass
                  return out
              avg_rows.append({
                  "group": k[0], "instance_name": k[1], "beta": k[2], "B": k[3], "version": k[4],
                  "runs": len(items),
                  "avg_best_fitness": avg_num(vals("best_fitness")),
                  "avg_best_mult_fitness": avg_num(vals("best_mult_fitness")),
                  "avg_best_single_fitness": avg_num(vals("best_single_fitness")),
                  "avg_best_no_resupply_fitness": avg_num(vals("best_no_resupply_fitness")),
                  "avg_best_multi_visit_trip_count": avg_num(vals("best_multi_visit_trip_count")),
                  "avg_best_trip_count": avg_num(vals("best_trip_count")),
              })

          out_avg = out_dir / "summary_f7_b10_cluster_random_3runs_avg_by_instance.csv"
          fields_avg = ["group","instance_name","beta","B","version","runs","avg_best_fitness","avg_best_mult_fitness","avg_best_single_fitness","avg_best_no_resupply_fitness","avg_best_multi_visit_trip_count","avg_best_trip_count"]
          with out_avg.open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=fields_avg, extrasaction="ignore")
              w.writeheader()
              w.writerows(avg_rows)

          fail_count = 0
          for r in rows:
              try:
                  if int(r.get("return_code", 0)) != 0:
                      fail_count += 1
              except Exception:
                  pass

          print(f"Wrote {len(rows)} rows to {out_csv}")
          print(f"Wrote {len(avg_rows)} rows to {out_avg}")
          print(f"Runs with non-zero return_code: {fail_count}")
          PY

      - name: Upload aggregate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary_f7_b10_cluster_random_3runs
          path: |
            results/summary_f7_b10_cluster_random_3runs.csv
            results/summary_f7_b10_cluster_random_3runs_avg_by_instance.csv
            results/solutions/**
            downloaded/**
          if-no-files-found: warn
